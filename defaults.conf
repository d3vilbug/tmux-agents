# tmux-agents defaults: the single source for colors, icons and sizes.
# Read by tmux-agents.tmux, bin/tmux-agents and sidebar/sidebar.ts.
# Override any of them in ~/.tmux.conf with `set -g <option> <value>`
# (before the run-shell line). Only lines starting with "@" are parsed:
# "<option> <value>", value runs to the end of the line.

# Behavior
@agents-key a
@agents-notify toast
# States that notify: any of "blocked done" (space separated).
@agents-notify-on blocked
@agents-sidebar-width 22
# Mark the card of the pane you are looking at: tint (background, like the
# status bar's current tab) | eye (eye icon) | off.
@agents-show-viewing tint
# Line drawn down the sidebar's right edge ("" for none).
@agents-sidebar-border │
@agents-toast-seconds 2.5
@agents-toast-width 38
@agents-toast-border single

# Colors (Dracula / Tomorrow Night palette)
@agents-color-blocked #cc6666
@agents-color-done #b5bd68
@agents-color-working #f0c574
@agents-color-idle #969896
@agents-color-title #8abdb6
@agents-color-header #969896
@agents-color-text #c4c8c5
@agents-color-muted #707880
@agents-color-faint #4b5056
@agents-color-select #373b41
@agents-color-viewing #373b41
@agents-color-border #4b5056
@agents-color-bg #1d1f21
@agents-color-claude #de935f
@agents-color-opencode #81a2be
# Codex's own TUI accent (ChatGPT Blue 200).
@agents-color-codex #63a8f8
@agents-color-agent #b294ba

# Icons (Nerd Font). "spinner" animates in the sidebar; tabs cannot animate,
# so they use @agents-tab-icon-working instead.
@agents-icon-blocked 󰀦
@agents-icon-done 󰄬
@agents-icon-working spinner
@agents-icon-idle 󰒲
@agents-tab-icon-working 󰔟
# Tab icon while Claude Code is working (instead of the hourglass): these
# frames, one character each, animated by the sidebar like Claude Code's own
# spinner (thin to fat, then back). While the sidebar is closed: the still
# icon below, with its style ("blink" = terminal blink attribute, "noblink").
@agents-tab-claude-frames ·✢*✶✻✽
# Milliseconds per frame.
@agents-tab-claude-frame-ms 250
# OpenCode working tab: its own scanner (■ sweeping over ⬝ dots), this many
# dots wide, in @agents-color-opencode.
@agents-tab-opencode-width 4
# How often the sidebar updates the tab animations (status-line redraws).
@agents-tab-frame-ms 40
@agents-tab-icon-claude-working ✻
@agents-tab-claude-working-style blink
# Codex working tab: its own braille spinner, these frames at this rate.
# While the sidebar is closed: the still icon below, with its style.
@agents-tab-codex-frames ⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏
@agents-tab-codex-frame-ms 125
@agents-tab-icon-codex-working ⠿
@agents-tab-codex-working-style blink
@agents-icon-claude 󰯉
@agents-icon-opencode 󰆞
@agents-icon-codex ›
@agents-icon-agent 󰚩
@agents-icon-window 󰖯
@agents-icon-viewing 
@agents-icon-header 󰙴

# Two-row block-art icons on sidebar cards, "top|bottom" (any width; the
# icon column takes the widest). Set to "" to use the one-cell icon above.
# Claude: the Claude Code mascot. OpenCode: its hollow-rectangle logo.
# Codex: its >_ prompt mark.
@agents-art-claude ▐▜▛▌|▀▛▜▀
@agents-art-opencode █▀█|█▄█
@agents-art-codex >_|
